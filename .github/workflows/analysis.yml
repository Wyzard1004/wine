name: Validate analysis

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install analysis environment
        run: python -m pip install -r requirements.txt -r requirements-docs.txt
      - name: Reproduce all experiments and figures
        run: python -m src.analysis
      - name: Check validation and data integrity
        run: python -m pytest -q
      - name: Verify committed data and results
        run: python scripts/check_reproducibility.py
      - name: Verify formatted report matches its source
        run: python scripts/render_report.py --check

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check dashboard interactions and mobile layout
        run: npm run test:dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-previews
          path: test-results/
